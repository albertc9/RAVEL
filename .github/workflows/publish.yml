name: Publish Python package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Test and build distributions
    runs-on: [self-hosted, linux, x64, ravel-release]
    env:
      TMPDIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.11 with uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.11"
          activate-environment: true
          enable-cache: true
          cache-python: true
          prune-cache: true
      - name: Install build and test dependencies
        run: uv pip install --upgrade build twine '.[test]'
      - name: Run tests
        run: python .github/scripts/run_release_tests.py
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Verify tag matches package version
        run: python .github/scripts/verify_release_version.py "${GITHUB_REF_NAME}" dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ravel-hls
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish package distributions
        uses: pypa/gh-action-pypi-publish@release/v1
