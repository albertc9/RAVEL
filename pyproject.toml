[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ravel-hls"
description = "Rate-Aware Vectorized Engine for Low-latency FPGA inference"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
version = "1.1.0"
dependencies = [
    "hls4ml==1.2.0",
    "hgq2==0.1.7",
    "Jinja2==3.1.6",
    "keras==3.12.1",
    "numpy==1.26.4",
    "quantizers==1.2.2",
    "PyYAML==6.0.3",
    "tensorflow-cpu==2.20.0; platform_system == 'Linux'",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]

[project.urls]
Repository = "https://github.com/albertc9/RAVEL"

[project.scripts]
ravel-hls = "ravel_hls.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ravel_hls = [
    "backends/vitis/templates/aria/firmware/*.j2",
    "backends/vitis/templates/aria/bridge/*.j2",
    "backends/vitis/templates/aria/testbench/*.j2",
    "schemas/*.json",
]
